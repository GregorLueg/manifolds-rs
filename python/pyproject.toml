[build-system]
requires = ["maturin>=1.15,<2.0"]
build-backend = "maturin"

[project]
name = "manifolds-rs"
description = "UMAP, t-SNE, PHATE, PaCMAP, LocalMAP, diffusion maps and ForceAtlas2 for single-cell and computational biology, in Rust."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Gregor Lueg", email = "gregorlueg@me.com" }]
requires-python = ">=3.10"
dependencies = ["numpy>=1.23", "beartype>=0.19"]
dynamic = ["version"]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Visualization",
]

[project.urls]
Documentation = "https://gregorlueg.github.io/manifolds-rs/"
Repository = "https://github.com/GregorLueg/manifolds-rs"
Changelog = "https://github.com/GregorLueg/manifolds-rs/blob/main/python/CHANGELOG.md"

[project.optional-dependencies]
# `mf.umap(adata)` / `mf.tsne(adata)`. scipy comes with anndata.
anndata = ["anndata>=0.10"]

[dependency-groups]
dev = [
    "maturin>=1.15,<2.0",
    "pytest>=8",
    "ruff>=0.9",
    "ty>=0.0.1",
    "scikit-learn>=1.4",
    "anndata>=0.10",
]
# mkdocstrings reads the installed package, so a docs build needs the compiled
# extension present: `maturin develop --release` before `mkdocs build`.
docs = [
    "mkdocs>=1.6",
    "mkdocs-jupyter>=0.25",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.27",
]
# Executes `docs/vignettes/*.py` into their `.ipynb` twins: `dev/vignettes.py`.
# The reference packages are only there for the benchmark cells.
vignettes = [
    "click>=8.1",
    "ipykernel>=6.29",
    "jupytext>=1.16",
    "nbclient>=0.10",
    "nbformat>=5.10",
    "matplotlib>=3.8",
    "polars>=1.0",
    "scikit-learn>=1.4",
    "umap-learn>=0.5",
    "openTSNE>=1.0",
    "pacmap>=0.8",
    "phate>=1.0",
]

[tool.maturin]
manifest-path = "Cargo.toml"
module-name = "manifolds_rs._manifolds"
python-source = "."
strip = true
include = ["manifolds_rs/py.typed", "manifolds_rs/*.pyi"]

[tool.ruff]
line-length = 88
target-version = "py310"
# The executed notebooks are generated from the jupytext sources next to them.
extend-exclude = ["docs/vignettes/*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
# `X` for the design matrix is the scikit-learn convention these estimators are
# deliberately matching.
ignore = ["N803"]

[tool.ruff.lint.per-file-ignores]
# `X` for the design matrix as a local, same convention as the `N803` ignore
# above. Only in tests: the package itself never binds it as a variable.
# `N802` for the `X` / `X32` fixtures, which are named for what they hold.
"tests/*" = ["N802", "N806"]
# A bare expression at the end of a notebook cell is its displayed output;
# markdown tables cannot wrap.
"docs/vignettes/*.py" = ["B018", "E501"]

[tool.ruff.lint.isort]
known-first-party = ["manifolds_rs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
